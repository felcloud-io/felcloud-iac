[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "felcloud"
version = "0.1.0"
description = "Assistant interactif pour créer une infrastructure OpenStack (FelCloud) avec Terraform ou Pulumi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "questionary>=2.0",
    "rich>=13.0",
    "jinja2>=3.1",
    # 4.23.0 est mal empaqueté (fichiers defaults.json et vendors/*.json absents) : connexion impossible.
    "openstacksdk>=3.0,!=4.23.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/felcloud-io/felcloud-iac"
Issues = "https://github.com/felcloud-io/felcloud-iac/issues"

[project.scripts]
felcloud = "felcloud.cli:main"

[tool.setuptools.packages.find]
include = ["felcloud*"]

[tool.setuptools.package-data]
felcloud = ["templates/**/*"]
